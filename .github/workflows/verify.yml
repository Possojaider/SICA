name: Verify SICA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sica-ci-ephemeral
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure business time zone
        run: docker exec -e MYSQL_PWD=sica-ci-ephemeral "${{ job.services.mysql.id }}" mysql -uroot -e "SET GLOBAL time_zone='-05:00'"
      - name: Compile and test with MySQL
        env:
          SICA_TEST_DB_PASSWORD: sica-ci-ephemeral
          SICA_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/?connectionTimeZone=America/Bogota&connectTimeout=5000&socketTimeout=15000
        run: ./mvnw -B -ntp verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports
