services:
  mysql:
    image: mysql:8.4
    container_name: sica-mysql
    command: ["--default-time-zone=-05:00"]
    environment:
      MYSQL_DATABASE: sica
      MYSQL_USER: sica
      MYSQL_PASSWORD: ${SICA_DB_PASSWORD:?Define SICA_DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${SICA_DB_PORT:-3306}:3306"
    volumes:
      - sica-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./src/main/resources/db/privileges.sql:/docker-entrypoint-initdb.d/03-privileges.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  sica-data:
